name: Continuous Integration & Security Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend Lint, Type Check & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: township_ops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          cd services/api
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff Lint & Formatting Check
        run: |
          cd services/api
          ruff check .
          ruff format --check .

      - name: Mypy Static Type Analysis
        run: |
          cd services/api
          set -eo pipefail
          if ! mypy app --config-file pyproject.toml 2>&1 | tee mypy_output.log; then
            while IFS= read -r line; do
              echo "::error::$line"
            done < mypy_output.log
            exit 1
          fi

      - name: Run Pytest Suite with Coverage
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/township_ops_test
          ENABLE_LOCAL_AUTH_BYPASS: "true"
          ENVIRONMENT: "development"
          MESSAGING_PROVIDER: "local"
        run: |
          cd services/api
          set -eo pipefail
          if ! pytest -v --cov=app --cov-report=term-missing --cov-report=xml --tb=short 2>&1 | tee pytest_output.log; then
            python -c "
          with open('pytest_output.log') as f:
              for line in f:
                  if line.startswith('FAILED ') or line.startswith('ERROR ') or 'ERRORS' in line:
                      print(f'::error::{line.strip()}')
          "
            exit 1
          fi

      - name: Publish Test Summary to Step Summary
        if: always()
        run: |
          if [ -f services/api/mypy_output.log ]; then
            echo "### Mypy Static Type Analysis" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 services/api/mypy_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f services/api/pytest_output.log ]; then
            echo "### Pytest Execution Summary" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 services/api/pytest_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Test Output Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-log
          path: |
            services/api/mypy_output.log
            services/api/pytest_output.log
          if-no-files-found: ignore

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          cd services/api
          pip-audit -r requirements.txt

  frontend-quality:
    name: Frontend Quality, Build & Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install Frontend Dependencies
        run: |
          cd apps/web
          npm ci

      - name: Run Frontend Tests (Vitest)
        run: |
          cd apps/web
          npm test -- --run

      - name: TypeScript Type Checking & Production Build
        run: |
          cd apps/web
          npm run build

      - name: NPM Security Audit
        run: |
          cd apps/web
          npm audit --audit-level=high

  infra-quality:
    name: Infrastructure CDK Synthesis & Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js for AWS CDK CLI
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk

      - name: Install CDK Python Dependencies
        run: |
          cd infra/cdk
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Infrastructure Unit Tests
        run: |
          cd infra/cdk
          python -m pytest -v

      - name: CDK Synthesis - Development
        run: |
          cd infra/cdk
          cdk synth -c env=dev

      - name: CDK Synthesis - Staging
        run: |
          cd infra/cdk
          cdk synth -c env=staging

      - name: CDK Synthesis - Production
        run: |
          cd infra/cdk
          cdk synth -c env=prod

  security-scan:
    name: Secret & Credential Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript', 'python' ]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
