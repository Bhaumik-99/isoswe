name: Deploy Production to AWS

on:
  workflow_run:
    workflows: ["Continuous Integration & Security Pipeline"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: township-ops-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy TownshipOps Production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
      CDK_DEFAULT_REGION: ap-south-1
      REQUIRE_DOCKER: "true"
      CDK_SKIP_DOCKER_BUNDLING: "false"

    steps:
      - name: Check out the exact commit tested by CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: infra/cdk/requirements.txt

      - name: Install AWS CDK
        run: |
          npm install --global aws-cdk
          python -m pip install --upgrade pip
          python -m pip install -r infra/cdk/requirements.txt

      - name: Bootstrap CDK environment
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "CDK_DEFAULT_ACCOUNT=$ACCOUNT_ID" >> "$GITHUB_ENV"
          cdk bootstrap "aws://$ACCOUNT_ID/$AWS_REGION" --app "python infra/cdk/app.py"

      - name: Deploy production infrastructure and backend
        run: |
          cdk deploy TownshipOps-Prod \
            --app "python infra/cdk/app.py" \
            -c env=prod \
            --require-approval never

      - name: Read deployment outputs
        id: outputs
        run: |
          API_URL="$(aws cloudformation describe-stacks \
            --stack-name TownshipOps-Prod \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue | [0]" \
            --output text)"
          CF_DOMAIN="$(aws cloudformation describe-stacks \
            --stack-name TownshipOps-Prod \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDomain'].OutputValue | [0]" \
            --output text)"
          if [ -z "$API_URL" ] || [ "$API_URL" = "None" ] || [ -z "$CF_DOMAIN" ] || [ "$CF_DOMAIN" = "None" ]; then
            echo "Required API or CloudFront output is missing." >&2
            exit 1
          fi
          echo "api_url=${API_URL%/}" >> "$GITHUB_OUTPUT"
          echo "cf_domain=$CF_DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Build production frontend
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ steps.outputs.outputs.api_url }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          npm ci
          npm run build

      - name: Publish frontend to private S3 bucket
        run: |
          aws s3 sync apps/web/dist s3://township-ops-web-prod \
            --delete --region "$AWS_REGION"

      - name: Invalidate CloudFront cache
        env:
          CF_DOMAIN: ${{ steps.outputs.outputs.cf_domain }}
        run: |
          DISTRIBUTION_ID="$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?DomainName=='$CF_DOMAIN'].Id | [0]" \
            --output text)"
          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" = "None" ]; then
            echo "Could not find CloudFront distribution for $CF_DOMAIN" >&2
            exit 1
          fi
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" --paths "/*"

      - name: Deployment summary
        if: success()
        run: |
          echo "### Production deployment succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${{ steps.outputs.outputs.api_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend: https://${{ steps.outputs.outputs.cf_domain }}" >> "$GITHUB_STEP_SUMMARY"
