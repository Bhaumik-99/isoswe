[project]
name = "township-ops-api"
version = "0.1.0"
description = "Multi-tenant Society Operations Platform API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.18",
    "mangum>=0.17.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    "requests>=2.32.0",
    "boto3>=1.34.0",
    "python-json-logger>=2.0.7",
    "uuid6>=2024.1.12",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-requests>=2.32.0",
    "types-boto3>=1.34.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "E402", "B904", "B023", "N806", "SIM118", "N818", "UP042"]

[tool.mypy]
python_version = "3.11"
mypy_path = "."
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "../.."]
